[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "glassworm-hunter"
version = "1.0.3"
description = "Detect GlassWorm supply chain attack payloads - technique detection, not just blocklists"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    { name = "AFINE", email = "afine@afine.com" },
]
keywords = ["security", "supply-chain", "malware", "vscode", "glassworm"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
    "Topic :: Software Development :: Quality Assurance",
]
dependencies = [
    "click>=8.0",
    "rich>=13.0",
]

[project.scripts]
glassworm-hunter = "glassworm_hunter.cli:main"

[project.urls]
Homepage = "https://github.com/afine-com/glassworm-hunter"
Issues = "https://github.com/afine-com/glassworm-hunter/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/glassworm_hunter"]

[tool.hatch.build.targets.wheel.force-include]
"data/ioc.json" = "glassworm_hunter/data/ioc.json"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
check_untyped_defs = true

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM"]
